<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <title>WebGIS – Kadirur Grama Panchayat</title>
        <meta name="description" content="Spatial Information System of Kadirur Grama Panchayat.">

        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
        }

        .ol-control > * {
            background-color: #f8f8f8 !important;
            color: #333333 !important;
            border-radius: 4px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444 !important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8 !important;
        }
        .ol-control > *:focus, .ol-control > *:hover {
            background-color: rgba(248, 248, 248, 0.9) !important;
        } 
        .ol-control {
            background-color: rgba(255, 255, 255, 0.6) !important;
            padding: 3px !important;
            border-radius: 6px;
        }
        </style>
    </head>
    <body>
        <div id="map">
            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>

        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>

        <script src="layers/GEOMORPHOLOGY_6.js"></script>
        <script src="layers/SOILTEXTURE_7.js"></script>
        <script src="layers/GEOLOGY_8.js"></script>
        <script src="layers/KADIRURBOUNDARY_10.js"></script>
        <script src="layers/BUILTUP_11.js"></script>
        <script src="layers/TOWERLINE_12.js"></script>
        <script src="layers/DRAINAGE_13.js"></script>
        <script src="layers/KSEBTOWER_14.js"></script>
        <script src="layers/SCHOOL_15.js"></script>
        <script src="layers/ROAD_16.js"></script>
        <script src="layers/KADIRURWARD_17.js"></script>

        <script src="styles/GEOMORPHOLOGY_6_style.js"></script>
        <script src="styles/SOILTEXTURE_7_style.js"></script>
        <script src="styles/GEOLOGY_8_style.js"></script>
        <script src="styles/KADIRURBOUNDARY_10_style.js"></script>
        <script src="styles/BUILTUP_11_style.js"></script>
        <script src="styles/TOWERLINE_12_style.js"></script>
        <script src="styles/DRAINAGE_13_style.js"></script>
        <script src="styles/KSEBTOWER_14_style.js"></script>
        <script src="styles/SCHOOL_15_style.js"></script>
        <script src="styles/ROAD_16_style.js"></script>
        <script src="styles/KADIRURWARD_17_style.js"></script>

        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
